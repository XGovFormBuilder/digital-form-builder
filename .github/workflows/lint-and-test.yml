name: Lint and test workflow

on:
  workflow_call:
    inputs:
      workspace:
        required: true
        description: the workspace to run the linting and tests for. Input one of "runner", "designer", or "model"
        type: string

# Lint and test are separate jobs so each reports its own check, and the test
# check can be required without the lint check.
jobs:
  lint:
    if: ${{!contains(github.event.head_commit.message, 'chore(deps-dev)')}}
    runs-on: ubuntu-latest
    name: lint ${{inputs.workspace}}
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{inputs.workspace}}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{inputs.workspace}}

      - name: Install project deps
        run: yarn

      - name: Build dependencies
        run: yarn build:dependencies

      - name: Lint
        run: yarn ${{inputs.workspace}} lint

  test:
    if: ${{!contains(github.event.head_commit.message, 'chore(deps-dev)')}}
    runs-on: ubuntu-latest
    name: test ${{inputs.workspace}}
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{inputs.workspace}}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{inputs.workspace}}

      - name: Install project deps
        run: yarn

      - name: Build dependencies
        id: build
        run: yarn build:dependencies

      - name: Check existing forms
        if: ${{ inputs.workspace == 'runner' }}
        run: yarn runner check-forms

      # Run whenever the build succeeded, so one failing step doesn't hide
      # the others' results.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: yarn ${{inputs.workspace}} test

      - name: Test utils
        if: ${{ inputs.workspace == 'runner' && !cancelled() && steps.build.outcome == 'success' }}
        run: yarn test:utils
